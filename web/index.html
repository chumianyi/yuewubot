<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a12">
<title>YueWuBot 控制台</title>
<link rel="stylesheet" href="./style.css?v=__V__">
</head>
<body>
<div class="backdrop" aria-hidden="true">
  <span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span>
  <span class="grid"></span>
</div>

<div id="boot" class="boot">
  <div class="boot-mark">Y</div>
  <div class="boot-bar"><i></i></div>
  <p>正在连接控制台…</p>
</div>

<section id="auth" class="auth hidden" aria-label="登录">
  <div class="auth-art">
    <div class="art-top">
      <span class="mark">Y</span>
      <span class="art-name">YueWuBot</span>
    </div>
    <h1>轻一点，<br>也能做很多事。</h1>
    <p class="art-sub">常驻 40MB 的聊天机器人框架，插件化、多平台、可自更新。</p>
    <div class="art-tags">
      <span>QQ 官方机器人</span><span>开源 MIT</span><span>单进程低内存</span>
    </div>
    <div class="art-flow">
      <div class="flow-line"><i></i><span>访问令牌登录</span><em>30 位字母数字</em></div>
      <div class="flow-line"><i></i><span>插件按需唤醒</span><em>低内存</em></div>
      <div class="flow-line"><i></i><span>一键更新</span><em>自动重启</em></div>
    </div>
    <div class="art-foot"><span id="artVer">v1.4.2</span><span>chumianyi.github.io</span></div>
  </div>
  <div class="auth-panel">
    <div class="auth-card" id="authCard"></div>
  </div>
</section>

<div id="shell" class="shell hidden">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <a class="brand" href="#dashboard" data-nav="dashboard">
        <span class="brand-mark">Y</span>
        <span class="brand-copy"><b>YueWuBot</b><small id="brandVer">v1.4.2</small></span>
      </a>
      <button class="icon-btn collapse-btn" id="collapseBtn" title="折叠侧栏" aria-label="折叠侧栏">
        <svg viewBox="0 0 24 24"><path d="M14.5 6 9 12l5.5 6"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-user">
        <span class="avatar" id="userAvatar">A</span>
        <span class="user-copy"><b id="userName">admin</b><small id="userRole">管理员</small></span>
        <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
          <svg viewBox="0 0 24 24" class="ico-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
          <svg viewBox="0 0 24 24" class="ico-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
      </div>
      <div class="side-status"><span class="pulse" id="sideDot"></span><span id="sideState">等待平台接入</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="菜单">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="crumb">
        <span id="crumbRoot">控制台</span><i>/</i><b id="pageTitle">概览</b>
      </div>
      <div class="top-actions">
        <button class="chip accent" id="updateChip" hidden></button>
        <span class="chip soft" id="memChip">-- MB</span>
        <span class="chip soft" id="verChip">v1.4.2</span>
        <button class="icon-btn" id="refreshBtn" title="刷新">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
      </div>
    </header>
    <main class="view" id="view"></main>
    <footer class="foot">
      <span>YueWuBot <b id="footVer">v1.4.2</b> · MIT</span>
      <a href="https://chumianyi.github.io/bot/docs.html" target="_blank" rel="noopener">使用手册</a>
      <a href="./docs" target="_blank" rel="noopener">开发文档</a>
    </footer>
  </div>
</div>

<div id="mask" class="mask hidden"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" role="status"></div>

<script src="./app.js?v=__V__"></script>
</body>
</html>
